name: geoarchive-ap04

x-app-environment: &app-environment
  GEOARCHIVE_ROOT: /app
  GEOARCHIVE_DATA_ROOT: /data
  GEOARCHIVE_SECRETS_ROOT: /run/secrets
  GEOARCHIVE_RUNS_ROOT: /data/runs
  GEOARCHIVE_INBOX_ROOT: /data/reports_inbox
  GEOARCHIVE_STAGING_ROOT: /data/reports_staging
  GEOARCHIVE_RESULTS_ROOT: /data/results
  OCR_API_URL: http://host.docker.internal:18080
  RAGFLOW_URL: http://host.docker.internal:9380/api/v1
  RAGFLOW_DATASET_ID: ${RAGFLOW_DATASET_ID:?Set RAGFLOW_DATASET_ID in .env.storage}
  RAGFLOW_VERIFY_TLS: "false"
  RAGFLOW_TOKEN_FILE: /run/secrets/ragflow_token.txt
  LLM_CREDENTIALS_FILE: /run/secrets/tokent.txt
  GEOARCHIVE_LLM_MODEL: openai/gpt-4o-mini
  ENABLE_ENRICHMENT: "true"
  AUTO_INTAKE_ENABLED: "false"
  JOB_EXECUTION_MODE: queue
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://host.docker.internal:19100}
  S3_BUCKET: ${S3_BUCKET:-geoarchive-reports}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env.storage}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env.storage}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_SOURCE_PREFIX: source
  S3_RESULTS_PREFIX: results

x-app-volumes: &app-volumes
  - /var/lib/geoarchive:/data
  - ../secrets:/run/secrets:ro
  - ../shapes:/app/shapes:ro

x-host-access: &host-access
  - host.docker.internal:host-gateway

services:
  web:
    image: geoarchive-web:ap04
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - "8180:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    image: geoarchive-api:ap04
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      <<: *app-environment
    extra_hosts: *host-access
    volumes: *app-volumes
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  worker:
    image: geoarchive-api:ap04
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    command: ["python", "-m", "pipeline.queue_worker"]
    working_dir: /app
    environment:
      <<: *app-environment
    extra_hosts: *host-access
    volumes: *app-volumes
    depends_on:
      api:
        condition: service_healthy
